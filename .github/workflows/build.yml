name: Build NaviApp IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Resolve dependencies
        run: xcodebuild -project NaviApp.xcodeproj -scheme NaviApp -resolvePackageDependencies

      - name: Build archive (unsigned)
        run: |
          xcodebuild -project NaviApp.xcodeproj -scheme NaviApp \
            -configuration Release \
            -archivePath build/NaviApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/NaviApp.xcarchive/Products/Applications/NaviApp.app build/Payload/
          cd build && zip -qr NaviApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NaviApp-unsigned-ipa
          path: build/NaviApp.ipa
